<div
    class="carousel"
    role="region"
    aria-roledescription="carousel"
    aria-label="Handmade cakesicle gallery"
    tabindex="0"
>
    <div class="photo-stage">
        <img
            class="photo-card"
            src="../assets/photos/gallery-04.jpg"
            alt="Pink mermaid and seashell cakesicles"
            data-position="-2"
            draggable="false"
        >

        <img
            class="photo-card"
            src="../assets/photos/gallery-01.jpg"
            alt="Handmade cat and animal cakesicles"
            data-position="-1"
            draggable="false"
        >

        <img
            class="photo-card"
            src="../assets/photos/pink.jpg"
            alt="Pink and white floral cakesicles"
            data-position="0"
            draggable="false"
        >

        <img
            class="photo-card"
            src="../assets/photos/gallery-05.jpg"
            alt="Cakesicles with seashell and starfish decorations"
            data-position="1"
            draggable="false"
        >

        <img
            class="photo-card"
            src="../assets/photos/gallery-02.jpg"
            alt="Construction-themed cakesicles"
            data-position="2"
            draggable="false"
        >
    </div>

    <div class="carousel-controls">
        <button
            class="carousel-previous"
            type="button"
            aria-label="Previous photo"
        >
            ←
        </button>

        <p>
            <span class="carousel-counter">03</span>
            <span class="separator">/</span>
            <span class="carousel-total">05</span>
        </p>

        <button
            class="carousel-next"
            type="button"
            aria-label="Next photo"
        >
            →
        </button>
    </div>

    <p class="carousel-caption" aria-live="polite">
        Pretty in pink, made for sharing.
    </p>
</div>
